name: Publish n8n-nodes-hookpost

# Publishes the n8n community node to npm with a provenance statement,
# which n8n requires for verified community nodes.
# Run it by pushing a tag such as n8n-node-v0.1.2 (matching n8n-node/package.json),
# or by hand from the Actions tab.

on:
  push:
    tags:
      - 'n8n-node-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="n8n-node-v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json (${expected})"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
